name: ci
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Verifica che i moduli principali si importino (sintassi/ESM ok)
      - run: node -e "import('./functions/v1/parse.js'); import('./functions/v1/batch/parse.js'); console.log('ok')"
