<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e164.it — E.164 formatter & validator</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 24px; max-width: 980px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: #666; }
    .row { display: grid; grid-template-columns: 1fr 220px; gap: 12px; align-items: end; }
    label { display: block; font-size: 12px; color: #444; margin-bottom: 6px; }
    input, select, button, textarea { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    .opts { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin-top: 16px; }
    pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; border: 1px solid #ddd; font-size: 12px; }
    .ok { border-color: #9ad29a; }
    .bad { border-color: #f0a0a0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .small { font-size: 12px; }
  </style>
</head>
<body>
  <h1>e164.it</h1>
  <p class="muted">Phone number formatter / validator (E.164) with outputs useful for VoIP, CRM, and logging.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="input">Phone number (messy input is OK)</label>
        <input id="input" placeholder="e.g. 0039 333 123 4567" value="0039 333 123 4567" />
      </div>
      <div>
        <label for="region">Default region (if country code is missing)</label>
        <select id="region">
          <option value="">(auto)</option>
          <option value="IT" selected>IT</option>
          <option value="US">US</option>
          <option value="GB">GB</option>
          <option value="FR">FR</option>
          <option value="DE">DE</option>
          <option value="ES">ES</option>
        </select>
      </div>
    </div>

    <div class="opts">
      <label class="pill"><input type="checkbox" id="fmt_intl" checked> international</label>
      <label class="pill"><input type="checkbox" id="fmt_nat" checked> national</label>
      <label class="pill"><input type="checkbox" id="fmt_rfc" checked> rfc3966 (tel:)</label>

      <label class="pill">
        Masking:
        <select id="mask" style="margin-left:6px; padding:4px 8px;">
          <option value="none" selected>none</option>
          <option value="last2">last2</option>
          <option value="last4">last4</option>
        </select>
      </label>

      <label class="pill"><input type="checkbox" id="hash"> hash (HMAC)</label>
    </div>

    <div style="margin-top:12px;">
      <label for="api_key">API key (optional)</label>
      <input id="api_key" placeholder="e164_..." autocomplete="off" />
      <div class="small muted" id="rl" style="margin-top:6px;">Rate limit: —</div>
    </div>


    <div class="actions">
      <button id="btn">Parse</button>
      <button id="btn_example_it" type="button">Example (IT)</button>
      <button id="btn_example_us" type="button">Example (US)</button>
      <span id="status" class="pill">idle</span>
    </div>
  </div>

  <div class="card">
    <div class="grid2">
      <div>
        <div class="small muted">Response (JSON)</div>
        <pre id="out">{}</pre>
      </div>
      <div>
        <div class="small muted">Quick copy</div>
        <div class="actions">
          <button id="copy_e164" type="button">Copy E.164</button>
          <button id="copy_tel" type="button">Copy tel:</button>
          <button id="copy_json" type="button">Copy JSON</button>
        </div>

        <div style="margin-top:12px;">
          <div class="small muted">Notes</div>
          <pre id="notes" class="muted">—</pre>
        </div>
      </div>
    </div>
  </div>

  <p class="muted small" style="margin-top:16px;">
    API: <code>POST /v1/parse</code>. Privacy: the endpoint can produce <em>masked</em> and <em>hash</em> outputs without storing the raw number.
  </p>

<script>
  const $ = (id) => document.getElementById(id);

  let last = null;

  const API_KEY_STORAGE = "e164_api_key";
  const apiKeyEl = $("api_key");
  if (apiKeyEl) {
    apiKeyEl.value = localStorage.getItem(API_KEY_STORAGE) || "";
    apiKeyEl.addEventListener("input", () => {
      const v = apiKeyEl.value.trim();
      if (v) localStorage.setItem(API_KEY_STORAGE, v);
      else localStorage.removeItem(API_KEY_STORAGE);
    });
  }

  function updateRateLimit(res) {
    const el = $("rl");
    if (!el || !res) return;

    const limit = res.headers.get("x-ratelimit-limit");
    const remaining = res.headers.get("x-ratelimit-remaining");
    const reset = res.headers.get("x-ratelimit-reset");

    if (limit && remaining && reset) {
      const resetMs = Number(reset) * 1000;
      const resetIso = Number.isFinite(resetMs) ? new Date(resetMs).toISOString() : "—";
      el.textContent = `Rate limit: ${remaining}/${limit} remaining (reset at ${resetIso})`;
    } else {
      el.textContent = "Rate limit: —";
    }
  }


  function setStatus(text, good=null) {
    const el = $("status");
    el.textContent = text;
    el.classList.remove("ok","bad");
    if (good === true) el.classList.add("ok");
    if (good === false) el.classList.add("bad");
  }

  function buildOptions() {
    const formats = ["e164"];
    if ($("fmt_intl").checked) formats.push("international");
    if ($("fmt_nat").checked) formats.push("national");
    if ($("fmt_rfc").checked) formats.push("rfc3966");

    return {
      format: formats,
      classify: true,
      mask: { mode: $("mask").value },
      hash: { enabled: $("hash").checked }
    };
  }

  async function parseNow() {
    setStatus("loading…");
    $("notes").textContent = "—";
    $("out").textContent = "{}";
    last = null;

    const input = $("input").value;
    const default_region = $("region").value || undefined;
    const payload = { input, default_region, options: buildOptions() };

    try {
      const apiKey = ($("api_key")?.value || "").trim();
      const headers = { "content-type": "application/json" };
      if (apiKey) headers["x-api-key"] = apiKey;

      const res = await fetch("/v1/parse", {
        method: "POST",
        headers,
        body: JSON.stringify(payload)
      });

      updateRateLimit(res);

      const txt = await res.text();
      let data;
      try { data = JSON.parse(txt); } catch { data = { raw: txt }; }

      last = data?.result || null;
      $("out").textContent = JSON.stringify(data, null, 2);
      const valid = data?.result?.valid;
      const good = Boolean(data && data.ok && valid === true);
      if (data && data.ok && valid === false) {
        setStatus("invalid", false);
      } else {
        setStatus(res.ok ? "ok" : ("http " + res.status), good);
      }

      // notes
      const notes = [];
      if (data?.warnings?.length) notes.push("warnings: " + data.warnings.join("; "));
      if (data?.errors?.length) notes.push("errors: " + data.errors.join("; "));
      if ($("hash").checked && data?.result?.hash_note) notes.push(data.result.hash_note);
      $("notes").textContent = notes.length ? notes.join("\n") : "—";

    } catch (e) {
      setStatus("error", false);
      $("out").textContent = String(e);
    }
  }

  async function copyText(t) {
    if (!t) return;
    try { await navigator.clipboard.writeText(t); } catch {}
  }

  $("btn").addEventListener("click", parseNow);

  $("btn_example_it").addEventListener("click", () => {
    $("input").value = "0039 333 123 4567";
    $("region").value = "IT";
    parseNow();
  });

  $("btn_example_us").addEventListener("click", () => {
    $("input").value = "(415) 555-2671";
    $("region").value = "US";
    parseNow();
  });

  $("copy_e164").addEventListener("click", () => copyText(last?.e164));
  $("copy_tel").addEventListener("click", () => copyText(last?.rfc3966));
  $("copy_json").addEventListener("click", () => copyText($("out").textContent));

  // run once
  parseNow();
</script>
</body>
</html>
