<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>e164.it — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 24px; max-width: 1200px; }
    nav a { margin-right: 12px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin: 16px 0; }
    .muted { color: #666; }
    label { display:block; font-size: 12px; color:#444; margin: 10px 0 6px; }
    input, button { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  </style>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <meta name="theme-color" content="#0b1460" />
  <script defer src="/nav.js?v=5"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="/assets/e164-mark.svg?v=2" alt="" width="44" height="44" loading="lazy" /></div>
        <div>
          <h1>Docs</h1>
          <p class="subtitle">API + Batch reference, operational notes, and examples.</p>
        </div>
      </div>
      <nav aria-label="Primary">
        <a href="/">Single</a>
        <a href="/batch/">Batch CSV</a>
        <a href="/docs/" aria-current="page">Docs</a>
        <a href="/api/">API</a>
        <a href="/privacy/">Privacy</a>
        <a href="/samples/">Samples</a>
      </nav>
    </header>

    <main>
<nav>
    <a href="/">Home</a>
    <a href="/batch/">Batch CSV</a>
    <a href="/api/">API</a>
    <a href="/admin/">Admin</a>
    <a href="/privacy/">Privacy</a>
  </nav>

  <h1 style="margin: 10px 0 6px;">API Docs</h1>
  <p class="muted" style="margin:0 0 14px;">Interactive documentation powered by OpenAPI.</p>

  <div class="card">
    <div class="row">
      <div style="flex: 1; min-width: 280px;">
        <label for="api_key">API key (optional)</label>
        <input id="api_key" placeholder="e164_..." autocomplete="off" style="width: 100%;" />
        <div class="muted" style="font-size:12px; margin-top:6px;">Stored locally in your browser (sessionStorage).</div>
      </div>
      <div style="min-width: 180px;">
        <label>&nbsp;</label>
        <button id="clear">Clear</button>
      </div>
    </div>
  </div>

  <div id="swagger-ui"></div>
</main>
  </div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script><script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script><script>
    const STORAGE_KEY = "e164_api_key";
    const apiKeyEl = document.getElementById("api_key");
    const clearBtn = document.getElementById("clear");

    apiKeyEl.value = sessionStorage.getItem(STORAGE_KEY) || "";
    apiKeyEl.addEventListener("input", () => {
      const v = apiKeyEl.value.trim();
      if (v) sessionStorage.setItem(STORAGE_KEY, v);
      else sessionStorage.removeItem(STORAGE_KEY);
    });
    clearBtn.addEventListener("click", () => {
      apiKeyEl.value = "";
      sessionStorage.removeItem(STORAGE_KEY);
    });

    window.ui = SwaggerUIBundle({
      url: "/v1/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset,
      ],
      layout: "StandaloneLayout",
      requestInterceptor: (req) => {
        const key = (apiKeyEl.value || "").trim();
        if (key) {
          req.headers = req.headers || {};
          req.headers["x-api-key"] = key;
        }
        return req;
      },
    });
  </script></body>
</html>
