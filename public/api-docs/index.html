<head>

  <title>e164.it — API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 24px; max-width: 1200px; }
    nav a { margin-right: 12px; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; margin: 16px 0; }
    .muted { color: #666; }
    label { display:block; font-size: 12px; color:#444; margin: 10px 0 6px; }
    input, button { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    .row { display:flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .tip{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid #ccc;
      color: #666;
      font-size: 11px;
      margin-left: 6px;
      position: relative;
      cursor: help;
      flex: 0 0 auto;
    }
    .tip::before,
    .tip::after{
      opacity: 0;
      pointer-events: none;
      transition: opacity .12s ease, transform .12s ease;
    }
    .tip::after{
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(2px);
      background: #fff;
      color: #111;
      border: 1px solid #ccc;
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      z-index: 20;
    }
    .tip::before{
      content: "";
      position: absolute;
      left: 50%;
      bottom: calc(100% + 2px);
      transform: translateX(-50%) translateY(2px);
      border: 6px solid transparent;
      border-top-color: #ccc;
    }
    .tip:hover::before,
    .tip:hover::after,
    .tip:focus::before,
    .tip:focus::after{
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
  </style>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <meta name="theme-color" content="#0b1460" />
  <script defer src="/build-meta.js?v=1"></script>
  <script defer src="/nav.js?v=5"></script>
</head>

<nav>

  <div class="card">
    <div class="row">
      <div style="flex: 1; min-width: 280px;">
        <label for="api_key">API key (optional)<span class="tip" tabindex="0" data-tip="Optional. When auth is enabled, sent as x-api-key.">?</span></label>
        <input id="api_key" placeholder="e164_..." autocomplete="off" style="width: 100%;" />
        <div class="muted" style="font-size:12px; margin-top:6px;">Stored locally in your browser (sessionStorage).</div>
        <div class="muted" style="font-size:12px; margin-top:6px;">Need a hosted key for Batch? See <a href="/docs/#getting-an-api-key">Docs</a>.</div>
      </div>
      <div style="min-width: 180px;">
        <label>&nbsp;</label>
        <button id="clear">Clear</button>
      </div>
    </div>
  </div>

  <div id="swagger-ui"></div>
</main>
